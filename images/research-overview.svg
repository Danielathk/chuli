<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="Lato, 'Gill Sans', Calibri, Arial, sans-serif">
  <defs>
    <!-- ice ring (pointy-top hexagon, r = 16) and its oxygen atoms -->
    <path id="ring" d="M0 -16 L13.86 -8 L13.86 8 L0 16 L-13.86 8 L-13.86 -8 Z" fill="#e3f5f7" stroke="#1098ad" stroke-width="2.2" stroke-linejoin="round"/>
    <g id="ringO" fill="#f4667e" stroke="#ffffff" stroke-width="1">
      <circle cy="-16" r="3.6"/><circle cx="13.86" cy="-8" r="3.6"/><circle cx="13.86" cy="8" r="3.6"/>
      <circle cy="16" r="3.6"/><circle cx="-13.86" cy="8" r="3.6"/><circle cx="-13.86" cy="-8" r="3.6"/>
    </g>
    <radialGradient id="iceGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4eb7c1" stop-opacity=".35"/><stop offset="1" stop-color="#4eb7c1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4ee"/><stop offset="1" stop-color="#ffe3e8"/>
    </linearGradient>
    <radialGradient id="pyroGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4667e" stop-opacity=".3"/><stop offset="1" stop-color="#f4667e" stop-opacity="0"/>
    </radialGradient>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c2255c"/>
    </marker>
    <!-- water molecule -->
    <g id="w">
      <line x1="0" y1="0" x2="-7" y2="-5" stroke="#9aa5b1" stroke-width="2"/>
      <line x1="0" y1="0" x2="7" y2="-5" stroke="#9aa5b1" stroke-width="2"/>
      <circle r="6.5" fill="#f4667e"/>
      <circle cx="-7.5" cy="-5.5" r="3.6" fill="#fff" stroke="#9aa5b1" stroke-width="1.2"/>
      <circle cx="7.5" cy="-5.5" r="3.6" fill="#fff" stroke="#9aa5b1" stroke-width="1.2"/>
    </g>
    <!-- graphene honeycomb tiles (a = 9) -->
    <pattern id="gA" width="15.59" height="27" patternUnits="userSpaceOnUse">
      <path d="M7.79 0 L15.59 4.5 L15.59 13.5 L7.79 18 L0 13.5 L0 4.5 Z M7.79 18 L7.79 27" fill="none" stroke="#5b8cc8" stroke-width="1.6"/>
    </pattern>
    <pattern id="gB" width="15.59" height="27" patternUnits="userSpaceOnUse" patternTransform="rotate(7 240 650)">
      <path d="M7.79 0 L15.59 4.5 L15.59 13.5 L7.79 18 L0 13.5 L0 4.5 Z M7.79 18 L7.79 27" fill="none" stroke="#4E2A84" stroke-opacity=".55" stroke-width="1.6"/>
    </pattern>
    <clipPath id="moire"><circle cx="240" cy="640" r="96"/></clipPath>
    <!-- perovskite octahedron (small) -->
    <g id="oct">
      <path d="M0 -10 L10 0 L0 10 L-10 0 Z" fill="#b9a3e3" stroke="#4E2A84" stroke-width="1.2"/>
      <circle r="2.6" fill="#4E2A84"/>
    </g>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6c757d"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4E2A84"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#ffffff"/>

  <!-- ===== connectors (drawn first, hub covers their inner ends) ===== -->
  <g stroke="#b9a3e3" stroke-width="2.5" stroke-dasharray="6 6" fill="none">
    <line x1="700" y1="410" x2="440" y2="205"/>
    <line x1="700" y1="410" x2="960" y2="205"/>
    <line x1="700" y1="410" x2="440" y2="615"/>
    <line x1="700" y1="410" x2="960" y2="615"/>
  </g>
  <g fill="#4E2A84"><circle cx="440" cy="205" r="6"/><circle cx="960" cy="205" r="6"/><circle cx="440" cy="615" r="6"/><circle cx="960" cy="615" r="6"/></g>

  <!-- ===== Card 1: phase transitions ===== -->
  <rect x="40" y="40" width="400" height="330" rx="16" fill="#f8fbfc" stroke="#d5e9ec"/>
  <rect x="40" y="40" width="400" height="7" rx="3" fill="#4eb7c1"/>
  <text x="64" y="86" font-size="23" font-weight="700" fill="#2b2b2b">Phase transitions</text>
  <text x="64" y="112" font-size="15.5" fill="#6c757d">Ice nucleation · perovskite crystallization</text>
  <!-- glow around the growing nucleus -->
  <ellipse cx="162" cy="282" rx="104" ry="82" fill="url(#iceGlow)"/>
  <!-- substrate -->
  <rect x="60" y="318" width="244" height="14" rx="3" fill="#c9ced6"/>
  <g fill="#9aa5b1"><circle cx="72" cy="325" r="3.5"/><circle cx="96" cy="325" r="3.5"/><circle cx="120" cy="325" r="3.5"/><circle cx="144" cy="325" r="3.5"/><circle cx="168" cy="325" r="3.5"/><circle cx="192" cy="325" r="3.5"/><circle cx="216" cy="325" r="3.5"/><circle cx="240" cy="325" r="3.5"/><circle cx="264" cy="325" r="3.5"/><circle cx="288" cy="325" r="3.5"/></g>
  <!-- hexagonal ice nucleus on the surface -->
  <use href="#ring" x="120" y="300"/><use href="#ring" x="147.72" y="300"/><use href="#ring" x="175.44" y="300"/>
  <use href="#ring" x="133.86" y="276"/><use href="#ring" x="161.58" y="276"/><use href="#ring" x="189.3" y="276"/>
  <use href="#ring" x="147.72" y="252"/><use href="#ring" x="175.44" y="252"/>
  <use href="#ring" x="203.16" y="300"/>
  <use href="#ringO" x="120" y="300"/><use href="#ringO" x="147.72" y="300"/><use href="#ringO" x="175.44" y="300"/>
  <use href="#ringO" x="133.86" y="276"/><use href="#ringO" x="161.58" y="276"/><use href="#ringO" x="189.3" y="276"/>
  <use href="#ringO" x="147.72" y="252"/><use href="#ringO" x="175.44" y="252"/>
  <use href="#ringO" x="203.16" y="300"/>
  <!-- disordered liquid water -->
  <use href="#w" x="80" y="182"/><use href="#w" x="122" y="164" opacity=".55"/><use href="#w" x="165" y="182"/>
  <use href="#w" x="208" y="162" opacity=".55"/><use href="#w" x="250" y="180"/><use href="#w" x="284" y="212" opacity=".55"/>
  <use href="#w" x="248" y="228"/><use href="#w" x="114" y="216" opacity=".55"/><use href="#w" x="190" y="214"/>
  <use href="#w" x="78" y="244"/><use href="#w" x="78" y="298" opacity=".55"/><use href="#w" x="278" y="296"/>
  <use href="#w" x="282" y="262" opacity=".55"/>
  <!-- free-energy profiles: classical (one barrier) vs non-classical (two barriers) -->
  <g stroke="#6c757d" stroke-width="1.6" fill="none">
    <line x1="318" y1="214" x2="424" y2="214" marker-end="url(#ah)"/>
    <line x1="318" y1="214" x2="318" y2="150" marker-end="url(#ah)"/>
    <line x1="318" y1="310" x2="424" y2="310" marker-end="url(#ah)"/>
    <line x1="318" y1="310" x2="318" y2="244" marker-end="url(#ah)"/>
  </g>
  <path d="M318 214 C338 212 350 166 368 166 C386 166 398 200 418 228" fill="none" stroke="#1098ad" stroke-width="3" stroke-linecap="round"/>
  <path d="M318 310 C330 308 336 264 348 264 C358 264 362 288 370 288 C380 288 386 258 396 258 C406 258 412 294 420 318" fill="none" stroke="#d6336c" stroke-width="3" stroke-linecap="round"/>
  <g font-size="13" font-weight="700" fill="#495057" text-anchor="end"><text x="313" y="162">F</text><text x="313" y="256">F</text></g>
  <text x="374" y="151" font-size="12.5" font-weight="700" fill="#1098ad" text-anchor="middle">classical</text>
  <text x="378" y="245" font-size="12.5" font-weight="700" fill="#d6336c" text-anchor="middle">non-classical</text>
  <text x="372" y="336" font-size="12.5" fill="#6c757d" text-anchor="middle">nucleus size</text>

  <!-- ===== Card 2: extreme-condition chemistry ===== -->
  <rect x="960" y="40" width="400" height="330" rx="16" fill="#fdf8f9" stroke="#f4d9de"/>
  <rect x="960" y="40" width="400" height="7" rx="3" fill="#f4667e"/>
  <text x="984" y="86" font-size="23" font-weight="700" fill="#2b2b2b">Extreme-condition chemistry</text>
  <text x="984" y="112" font-size="15.5" fill="#6c757d">CO₂ reactions in supercritical water</text>
  <!-- supercritical water backdrop -->
  <rect x="976" y="128" width="368" height="228" rx="12" fill="url(#scw)" stroke="#f8cfd7"/>
  <text x="1336" y="146" font-size="12.5" fill="#9b5a66" text-anchor="end">supercritical H₂O · high P, T</text>
  <use href="#w" x="1320" y="252" opacity=".3"/><use href="#w" x="996" y="302" opacity=".3"/>
  <!-- row 1: conventional route CO2 -> HCO3- -> CO3 2- -->
  <text x="988" y="146" font-size="12.5" fill="#868e96">conventional</text>
  <g stroke="#9aa5b1" stroke-width="2" stroke-dasharray="4 4" fill="none">
    <line x1="1056" y1="180" x2="1116" y2="180" marker-end="url(#ah)"/>
    <line x1="1184" y1="180" x2="1252" y2="180" marker-end="url(#ah)"/>
  </g>
  <g transform="translate(1025 180)">
    <g stroke="#868e96" stroke-width="2"><line x1="-20" y1="-2.5" x2="20" y2="-2.5"/><line x1="-20" y1="2.5" x2="20" y2="2.5"/></g>
    <circle cx="-20" r="6.5" fill="#f4667e"/><circle r="7.5" fill="#495057"/><circle cx="20" r="6.5" fill="#f4667e"/>
  </g>
  <g transform="translate(1150 182)">
    <g stroke="#868e96" stroke-width="2"><line x1="-2.5" y1="0" x2="-2.5" y2="-19"/><line x1="2.5" y1="0" x2="2.5" y2="-19"/><line x1="0" y1="0" x2="-16.5" y2="9.5"/><line x1="0" y1="0" x2="16.5" y2="9.5"/><line x1="16.5" y1="9.5" x2="26.9" y2="15.5"/></g>
    <circle cx="26.9" cy="15.5" r="3.8" fill="#fff" stroke="#9aa5b1" stroke-width="1.2"/>
    <circle cy="-19" r="6.5" fill="#f4667e"/><circle cx="-16.5" cy="9.5" r="6.5" fill="#f4667e"/><circle cx="16.5" cy="9.5" r="6.5" fill="#f4667e"/>
    <circle r="7.5" fill="#495057"/>
  </g>
  <g transform="translate(1275 182)">
    <g stroke="#868e96" stroke-width="2"><line x1="0" y1="0" x2="0" y2="-19"/><line x1="0" y1="0" x2="-16.5" y2="9.5"/><line x1="0" y1="0" x2="16.5" y2="9.5"/></g>
    <circle cy="-19" r="6.5" fill="#f4667e"/><circle cx="-16.5" cy="9.5" r="6.5" fill="#f4667e"/><circle cx="16.5" cy="9.5" r="6.5" fill="#f4667e"/>
    <circle r="7.5" fill="#495057"/>
  </g>
  <g font-size="14" font-weight="700" fill="#c2255c" text-anchor="middle">
    <text x="1025" y="216">CO₂</text><text x="1150" y="218">HCO₃⁻</text><text x="1275" y="218">CO₃²⁻</text>
  </g>
  <!-- row 2: new pathway CO2 + CO3 2- -> C2O5 2- <-> H2C2O5 -->
  <ellipse cx="1110" cy="302" rx="62" ry="40" fill="url(#pyroGlow)"/>
  <g stroke="#c2255c" stroke-width="2.4" fill="none">
    <line x1="1030" y1="226" x2="1084" y2="272" marker-end="url(#ag)"/>
    <line x1="1266" y1="226" x2="1144" y2="274" marker-end="url(#ag)"/>
    <line x1="1160" y1="297" x2="1226" y2="297" marker-start="url(#ag)" marker-end="url(#ag)"/>
  </g>
  <text x="1125" y="250" font-size="13" font-weight="700" fill="#c2255c" text-anchor="middle">new pathway</text>
  <g transform="translate(1110 286)">
    <g stroke="#868e96" stroke-width="2"><line x1="0" y1="0" x2="-22" y2="10"/><line x1="0" y1="0" x2="22" y2="10"/><line x1="-22" y1="10" x2="-40" y2="2"/><line x1="-22" y1="10" x2="-24" y2="30"/><line x1="22" y1="10" x2="40" y2="2"/><line x1="22" y1="10" x2="24" y2="30"/></g>
    <circle r="6.5" fill="#f4667e"/>
    <circle cx="-40" cy="2" r="6.5" fill="#f4667e"/><circle cx="-24" cy="30" r="6.5" fill="#f4667e"/>
    <circle cx="40" cy="2" r="6.5" fill="#f4667e"/><circle cx="24" cy="30" r="6.5" fill="#f4667e"/>
    <circle cx="-22" cy="10" r="7.5" fill="#495057"/><circle cx="22" cy="10" r="7.5" fill="#495057"/>
  </g>
  <rect x="1232" y="281" width="72" height="32" rx="16" fill="#ffffff" stroke="#f4667e" stroke-width="2"/>
  <text x="1268" y="302" font-size="13" font-weight="700" fill="#c2255c" text-anchor="middle">H₂C₂O₅</text>
  <text x="1110" y="344" font-size="13" text-anchor="middle"><tspan font-weight="700" fill="#c2255c">C₂O₅²⁻</tspan><tspan fill="#9b5a66"> pyrocarbonate</tspan></text>
  <text x="1268" y="334" font-size="12" fill="#9b5a66" text-anchor="middle">pyrocarbonic acid</text>

  <!-- ===== Card 3: 2D and moiré materials ===== -->
  <rect x="40" y="450" width="400" height="330" rx="16" fill="#f7f9fd" stroke="#dbe5f3"/>
  <rect x="40" y="450" width="400" height="7" rx="3" fill="#7aa6d8"/>
  <text x="64" y="496" font-size="23" font-weight="700" fill="#2b2b2b">2D &amp; moiré materials</text>
  <text x="64" y="522" font-size="15.5" fill="#6c757d">Phonons in twisted bilayer graphene</text>
  <g clip-path="url(#moire)">
    <rect x="140" y="540" width="200" height="200" fill="#ffffff"/>
    <rect x="140" y="540" width="200" height="200" fill="url(#gA)"/>
    <rect x="100" y="500" width="280" height="280" fill="url(#gB)"/>
  </g>
  <circle cx="240" cy="640" r="96" fill="none" stroke="#7aa6d8" stroke-width="3"/>
  <!-- phonon wave -->
  <path d="M352 600 q10 -14 20 0 t20 0 t20 0" fill="none" stroke="#5b8cc8" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M352 640 q10 -14 20 0 t20 0 t20 0" fill="none" stroke="#5b8cc8" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M352 680 q10 -14 20 0 t20 0 t20 0" fill="none" stroke="#5b8cc8" stroke-width="2.6" stroke-linecap="round"/>
  <text x="382" y="718" font-size="14" fill="#6c757d" text-anchor="middle">phonons</text>
  <text x="96" y="760" font-size="14" fill="#6c757d">twist θ</text>

  <!-- ===== Card 4: perovskite solar cells ===== -->
  <rect x="960" y="450" width="400" height="330" rx="16" fill="#fefaf7" stroke="#f6e0cf"/>
  <rect x="960" y="450" width="400" height="7" rx="3" fill="#f79b5c"/>
  <text x="984" y="496" font-size="23" font-weight="700" fill="#2b2b2b">Perovskite solar cells</text>
  <text x="984" y="522" font-size="15.5" fill="#6c757d">ML-guided discovery of interface materials</text>
  <!-- sunlight -->
  <circle cx="1008" cy="566" r="14" fill="#f59f00"/>
  <g stroke="#f59f00" stroke-width="2.4" stroke-linecap="round">
    <line x1="1008" y1="544" x2="1008" y2="538"/><line x1="986" y1="566" x2="980" y2="566"/><line x1="1023" y1="551" x2="1028" y2="546"/><line x1="993" y1="551" x2="988" y2="546"/>
  </g>
  <!-- device stack -->
  <g font-size="12.5" font-weight="700" text-anchor="middle">
    <rect x="1036" y="586" width="170" height="20" fill="#8f96a0"/><text x="1121" y="600" fill="#fff">Electrode</text>
    <rect x="1036" y="606" width="170" height="18" fill="#a9dba0"/><text x="1121" y="619" fill="#2b5d27">C60 / BCP</text>
    <rect x="1036" y="624" width="170" height="52" fill="#efe6f8"/>
    <rect x="1036" y="676" width="170" height="18" fill="#f79b5c"/><text x="1121" y="689" fill="#fff">SAM</text>
    <rect x="1036" y="694" width="170" height="20" fill="#f7cfb3"/><text x="1121" y="708" fill="#8a4a1f">TCO</text>
    <rect x="1036" y="714" width="170" height="22" fill="#c9ced6"/><text x="1121" y="729" fill="#4a4f57">Glass</text>
  </g>
  <use href="#oct" x="1054" y="650"/><use href="#oct" x="1078" y="650"/><use href="#oct" x="1102" y="650"/><use href="#oct" x="1126" y="650"/><use href="#oct" x="1150" y="650"/><use href="#oct" x="1174" y="650"/><use href="#oct" x="1196" y="650"/>
  <path d="M1016 584 L1040 612" stroke="#f59f00" stroke-width="2.4" stroke-dasharray="4 4"/>
  <!-- ML model proposing molecules -->
  <g stroke="#cfc4e4" stroke-width="1.4">
    <path d="M1262 590 L1296 574 M1262 590 L1296 606 M1262 590 L1296 638 M1262 630 L1296 574 M1262 630 L1296 606 M1262 630 L1296 638 M1296 574 L1330 606 M1296 606 L1330 606 M1296 638 L1330 606"/>
  </g>
  <g fill="#fff" stroke="#4E2A84" stroke-width="2"><circle cx="1262" cy="590" r="7"/><circle cx="1262" cy="630" r="7"/><circle cx="1296" cy="574" r="7"/><circle cx="1296" cy="606" r="7"/><circle cx="1296" cy="638" r="7"/></g>
  <circle cx="1330" cy="606" r="9" fill="#f79b5c" stroke="#4E2A84" stroke-width="2"/>
  <text x="1296" y="560" font-size="14" fill="#6c757d" text-anchor="middle">ML model</text>
  <!-- candidate molecule fed to the SAM layer -->
  <g transform="translate(1290 700)">
    <path d="M0 -14 L12 -7 L12 7 L0 14 L-12 7 L-12 -7 Z" fill="#fff" stroke="#e8590c" stroke-width="2.2"/>
    <path d="M0 14 L0 26" stroke="#e8590c" stroke-width="2.2"/>
    <circle cy="30" r="4.5" fill="#e8590c"/>
  </g>
  <path d="M1314 622 C1322 652 1316 672 1306 684" fill="none" stroke="#4E2A84" stroke-width="2" marker-end="url(#ap)"/>
  <path d="M1270 712 L1214 686" fill="none" stroke="#4E2A84" stroke-width="2" marker-end="url(#ap)"/>
  <text x="1300" y="758" font-size="14" fill="#6c757d" text-anchor="middle">new interface molecules</text>

  <!-- ===== Hub: multiscale modeling ===== -->
  <circle cx="700" cy="410" r="186" fill="none" stroke="#d9cdee" stroke-width="2" stroke-dasharray="3 7"/>
  <circle cx="700" cy="410" r="165" fill="#4E2A84"/>
  <text x="700" y="318" font-size="13.5" font-weight="700" fill="#c9b8ea" text-anchor="middle" letter-spacing="2.5">MULTISCALE MODELING</text>
  <text x="700" y="352" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">From electrons</text>
  <text x="700" y="382" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">to devices</text>
  <line x1="610" y1="402" x2="790" y2="402" stroke="#8a6cc4" stroke-width="1.5"/>
  <g font-size="20.5" fill="#efe9f8" text-anchor="middle">
    <text x="700" y="436">First-principles calculations</text>
    <text x="700" y="466">Atomistic simulation</text>
    <text x="700" y="496">Kinetic modeling</text>
    <text x="700" y="526">Machine learning</text>
  </g>
</svg>
